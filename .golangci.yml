# golangci-lint v2 configuration.
# Verify after editing:  golangci-lint config verify
# Migrating from v1:     golangci-lint migrate

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - depguard        # I-6 / I-11 / I-14 — the invariant enforcer
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck    # ctx propagation
    - errorlint       # %w wrapping (I-15)
    - noctx           # no HTTP without context (I-5)
    - rowserrcheck
    - sqlclosecheck
    - gosec
    - revive
    - misspell
    - unconvert
    - wastedassign
    - nilerr
    - forbidigo

  settings:
    depguard:
      rules:
        # I-6: internal/domain is pure. Standard library only.
        domain-purity:
          files:
            - "**/internal/domain/**"
            - "!**/internal/domain/*_test.go"
          allow:
            - $gostd
          deny:
            - pkg: "github.com"
              desc: "I-6: internal/domain must import the standard library only"
            - pkg: "golang.org/x"
              desc: "I-6: internal/domain must import the standard library only"

        # I-6: internal/rca is pure. Standard library + internal/domain only.
        #
        # No `deny` list here on purpose: depguard v2 evaluates deny before
        # allow, so a broad `deny: pkg: "github.com"` would also catch this
        # module's own import path (github.com/tiepnguyen-sg/whymiss/...) and
        # silently block internal/domain even though it's in `allow` —
        # verified by reproducing it (internal/domain's import was rejected
        # with both listed) and confirming the fix (removing `deny` still
        # correctly rejects an unrelated package like net/http, since a
        # non-empty `allow` list is implicitly exclusive in depguard v2).
        #
        # The root package imports internal/rca/rules to obtain the explicit,
        # immutable rule order. The whole subtree remains pure: its only
        # non-stdlib imports are internal/domain and its own rules package.
        rca-purity:
          files:
            - "**/internal/rca/**"
            - "!**/internal/rca/*_test.go"
            - "!**/internal/rca/rules/*_test.go"
          allow:
            - $gostd
            - github.com/tiepnguyen-sg/whymiss/internal/domain
            - github.com/tiepnguyen-sg/whymiss/internal/rca/rules

        # I-11: only adapters may reach the network or the OS.
        adapters-only:
          files:
            - "**/internal/timeline/**"
            - "**/internal/report/**"
          deny:
            - pkg: "net/http"
              desc: "I-11: outbound I/O belongs in internal/source/"
            - pkg: "os/exec"
              desc: "I-11: process execution belongs in internal/source/"

    errcheck:
      check-type-assertions: true
      check-blank: true

    forbidigo:
      forbid:
        - pattern: "^print(ln)?$"
        - pattern: "^fmt\\.Print.*$"
          msg: "use log/slog, not fmt.Print (I-15)"
        - pattern: "^log\\.(Fatal|Panic).*$"
          msg: "library code must not exit or panic (I-15)"
        - pattern: "^os\\.Exit$"
          msg: "only cmd/ may exit (I-15)"

    gosec:
      excludes:
        - G304  # file inclusion — we read operator-configured paths by design
        - G703  # path traversal via taint — same operator-configured-path reasoning as G304

    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: context-keys-type
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: unexported-return

  exclusions:
    rules:
      # cmd/ is the only place allowed to exit. tools/ gets the same pass: each
      # subdirectory there is its own standalone `package main` (faultinjector,
      # corpusctl, eval), not library code anything else imports — I-15's "only
      # main" reading applies to it the same way it applies to cmd/whymiss.
      - path: "^(cmd|tools)/"
        linters: [forbidigo]
      # tools/faultinjector's entire job is shelling out to docker/kurtosis with
      # dynamic arguments (container ids, service names) discovered from the
      # devnet or read from a scenario file — G204 fires on every such call by
      # design, not by oversight. Scoped to this one tool, not internal/ or
      # cmd/, where an unexpected subprocess launch would be worth flagging.
      - path: "^tools/faultinjector/"
        linters: [gosec]
        text: "G204"
      # Tests may construct fixtures loosely.
      - path: "_test\\.go$"
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tiepnguyen-sg/whymiss
