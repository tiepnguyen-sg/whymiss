name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  gate:
    name: invariant gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin actions by SHA, not tag — supply-chain hygiene the project preaches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: format
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofumpt -l .)" || { gofumpt -l .; echo "run: make fmt"; exit 1; }

      # action v9 is the first line that reads a golangci-lint v2 config.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: invariants (I-4, I-6, I-11)
        run: make check

      - name: test
        run: go test -race -count=1 ./...

      - name: vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: cross-compile (I-13)
        run: make build.all

      - name: changelog updated
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(internal|cmd)/' \
             && ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^CHANGELOG.md$'; then
            echo "Code changed but CHANGELOG.md was not updated (I-16)."
            exit 1
          fi

  agent-contract:
    name: agent contract intact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # If CLAUDE.md is a real file rather than a symlink, prove it still
      # imports AGENTS.md. This is the drift guard between the two tools.
      - name: CLAUDE.md points at AGENTS.md
        run: |
          test -f AGENTS.md || { echo "AGENTS.md missing"; exit 1; }
          if [ -L CLAUDE.md ]; then
            echo "CLAUDE.md is a symlink to $(readlink CLAUDE.md)"
            [ "$(readlink CLAUDE.md)" = "AGENTS.md" ] || exit 1
          else
            grep -q '@AGENTS.md' CLAUDE.md \
              || { echo "CLAUDE.md must import @AGENTS.md"; exit 1; }
          fi

      - name: AGENTS.md within Codex budget
        run: |
          size=$(wc -c < AGENTS.md)
          echo "AGENTS.md = ${size} bytes"
          [ "$size" -lt 8192 ] || { echo "AGENTS.md over 8 KB — move detail into docs/"; exit 1; }
