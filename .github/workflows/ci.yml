name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  gate:
    name: invariant gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin actions by SHA, not tag — supply-chain hygiene the project preaches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6" # must equal go.mod's toolchain line; make check.toolchain enforces it
          check-latest: false

      - name: install ci tooling
        run: |
          go install mvdan.cc/gofumpt@v0.11.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/goreleaser/goreleaser/v2@v2.17.1

      - name: make ci
        run: |
          make ci
          git diff --exit-code

      - name: changelog updated
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(internal|cmd)/' \
             && ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^CHANGELOG.md$'; then
            echo "Code changed but CHANGELOG.md was not updated (I-16)."
            exit 1
          fi

  agent-contract:
    name: agent contract intact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # If CLAUDE.md is a real file rather than a symlink, prove it still
      # imports AGENTS.md. This is the drift guard between the two tools.
      - name: CLAUDE.md points at AGENTS.md
        run: |
          test -f AGENTS.md || { echo "AGENTS.md missing"; exit 1; }
          if [ -L CLAUDE.md ]; then
            echo "CLAUDE.md is a symlink to $(readlink CLAUDE.md)"
            [ "$(readlink CLAUDE.md)" = "AGENTS.md" ] || exit 1
          else
            grep -q '@AGENTS.md' CLAUDE.md \
              || { echo "CLAUDE.md must import @AGENTS.md"; exit 1; }
          fi

      - name: AGENTS.md within Codex budget
        run: |
          size=$(wc -c < AGENTS.md)
          echo "AGENTS.md = ${size} bytes"
          [ "$size" -lt 8192 ] || { echo "AGENTS.md over 8 KB — move detail into docs/"; exit 1; }
