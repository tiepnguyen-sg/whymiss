name: release

on:
  push:
    tags: ["v*"]

# Least privilege at the workflow level; each job elevates only what it
# needs (ADR-0010).
permissions:
  contents: read

jobs:
  goreleaser:
    name: build, sign, sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # cosign keyless signing via GitHub OIDC (ADR-0010)
    steps:
      # Pin actions by SHA, not tag — matches ci.yml's existing convention.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog and tag list

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: install syft (SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SLSA provenance (slsa-framework/slsa-github-generator) is deliberately
  # not wired in here while this repo is private. That reusable workflow
  # refuses to run against a private repo unless `private-repository: true`
  # is set, specifically because publishing provenance means publishing an
  # entry to Sigstore's public Rekor transparency log — and that entry
  # would name this repo, defeating its privacy. v0.1.0 shipped without it
  # for exactly that reason (a deliberate choice, not an oversight — see
  # ADR-0010 and CHANGELOG.md). Re-add the `provenance` job (same shape as
  # the `goreleaser` job's checksums.txt → base64 `hashes` output, feeding
  # `slsa-framework/slsa-github-generator`'s `generator_generic_slsa3.yml`)
  # if this repo ever goes public.
