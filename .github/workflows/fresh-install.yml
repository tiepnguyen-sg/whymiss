name: fresh-install

# Task 4.9 (BUILD_PROMPT.md §12.2): does README.md's instructions actually
# work on a clean machine with no tribal knowledge? The source job checks the
# documented commands and flags; the Compose job supplies captured node responses
# so the real sidecar and monitoring stack can stay up deterministically.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "Makefile"
      - "go.mod"
      - "cmd/**"
      - "deploy/**"
      - "test/freshinstall/**"
      - ".github/workflows/fresh-install.yml"
  pull_request:
    paths:
      - "README.md"
      - "Makefile"
      - "go.mod"
      - "cmd/**"
      - "deploy/**"
      - "test/freshinstall/**"
      - ".github/workflows/fresh-install.yml"
  schedule:
    # Exercise the complete published quickstart weekly, including pinned
    # upstream images and Docker runtime behavior.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  from-source:
    name: "README: from source"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6" # must equal go.mod's toolchain line; make check.toolchain enforces it
          check-latest: false

      # README.md "From source": `make build`.
      - run: make build

      # README's example command names these flags. If one was renamed,
      # this fails loudly instead of leaving stale copy-paste in the docs.
      - name: README's documented flags still exist
        run: |
          set -eu
          help="$(./bin/whymiss watch --help)"
          for flag in beacon-api db validator-index metrics-addr; do
            echo "$help" | grep -q -- "--$flag" \
              || { echo "README references --$flag, but 'whymiss watch --help' does not list it"; exit 1; }
          done
          ./bin/whymiss --help >/dev/null

  docker-compose:
    name: "README: Docker Compose"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Replays byte-for-byte responses captured from the Kurtosis devnet; the
      # Make target owns isolated Compose state and cleanup for CI and local use.
      - name: make test.freshinstall
        run: make test.freshinstall
