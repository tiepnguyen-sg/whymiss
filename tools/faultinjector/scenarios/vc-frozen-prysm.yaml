id: vc-frozen-prysm
description: >
  The Prysm validator client's container is frozen (docker pause) for the full
  duty window — the same fault as vc-frozen-lighthouse, on the other client, to
  prove the taxonomy attribution and the injector itself are not
  client-specific (I-11).
target: vc-2-geth-prysm
validator_index: 33
duration: 20s
avoid_proposer_validators: [32, 63]
fault:
  kind: pause
  pause: {}
expect:
  cause: local.vc_disconnected
  confidence: high
