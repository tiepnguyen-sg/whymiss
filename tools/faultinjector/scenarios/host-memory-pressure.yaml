id: host-memory-pressure
description: >
  The Lighthouse-paired execution client's cgroup v2 memory.high is capped
  to 128MB for the full duty window — well under geth's normal working set
  for this devnet, forcing sustained reclaim. memory.high throttles and
  reclaims rather than OOM-killing the process (unlike memory.max), which is
  what docs/causes.md's local.host.memory_pressure rule measures via PSI.
target: el-1-geth-lighthouse
validator_index: 24
duration: 25s
sample_pressure: memory
fault:
  kind: cgroup_mem
  cgroup_mem:
    limit_bytes: 134217728
expect:
  cause: local.host.memory_pressure
  confidence: medium
