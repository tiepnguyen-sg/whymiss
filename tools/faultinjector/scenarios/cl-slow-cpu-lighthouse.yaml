id: cl-slow-cpu-lighthouse
description: >
  The Lighthouse consensus client's CPU is capped to 9% of one core for the
  full duty window while geth remains unthrottled. Exact per-slot Engine
  counters separate consensus validation time from execution latency, and
  Lighthouse-side proposers are excluded so proposal production cannot
  confound the watched attestation.
  RE-TUNED 2026-08-26 for the three-node devnet. At quota_percent 9 this recipe
  produced a healthy duty on both campaign rounds (r02, r03) — verdict "" at high
  confidence, block_found and included both true. The recipe was not broken; the
  devnet underneath it changed. With a third participant the throttled node
  receives each block from two peers instead of one, so it still observes the
  block in time even with its CPU cut, and beacon_block_delay_observed_slot_start
  never slips past the deadline. The sibling cl-slow-cpu recipe passed 2/2 in the
  same campaign at quota_percent 7, which brackets the answer: 9 is now too loose
  and 7 still bites.

  Bisection log (quota_percent / result):
     9 / healthy, no cause — 0/2 on the three-node devnet (was tuned on two)
     5 (current) / local.cl_slow on r04, unknown.insufficient_data on r05 — 1/2

  MARGINAL AT 5%, and the failure mode is worth reading before adjusting it.
  r05 did not come back with a wrong label; it came back with no timing at all.
  At 5% of a core the consensus client cannot answer its own metrics endpoint in
  time, so no promscrape block_seen is recorded, no stage boundary exists, and
  R-999 reports unknown.insufficient_data — the fault broke the channel the
  scenario measures through rather than the thing it means to measure. That is
  the same wall host-memory-pressure hit at 16MB.

  So 9 is too loose and 5 is at the edge of too severe. 7 is the obvious
  candidate — the sibling cl-slow-cpu recipe passes 2/2 there against Prysm — but
  it has not been tried against Lighthouse, and the value left here is the one
  that has actually produced the cause. Left at 5 with the rate recorded rather
  than moved to an untested number.

  OBSERVER FIXED 2026-08-27, so retry at 5 before re-tuning. Two of the three
  ways r05 could lose its timing were measurement bugs rather than the fault
  being too severe, and both are now closed. The head was polled every 200ms and
  the poll gave up the instant it read a later slot, so a starved node's head
  stepping from slot-1 to slot+1 between samples lost the observation outright;
  the head is now read from the SSE event stream alongside the poll, which cannot
  drop a transition. And the arrival gauge was scraped only after the head
  arrived, within a 3s window, aborting on the first failed scrape; it is now
  watched from before the slot begins and tolerates a failed scrape until the
  deadline. A node at 5% of a core that answers its metrics endpoint late but not
  never will now be measured where it previously was not, so the 1/2 rate above
  is a floor, not the recipe's ceiling.

  MEASURED AFTER THE FIX, and the answer is not what the bisection log predicted.
  r05 (2026-08-27, slot 289) recorded every stage cleanly — the observer race is
  gone — and still did not earn its label:

    propagation  1.056s   ( 5.9%)
    validation   8.901s   (49.7%)   <- head_updated at +9.957s
    signing      7.947s   (44.4%)   <- attestation_published at +17.904s
    engine total 1.398s   (newPayload 968.9ms + forkchoiceUpdated 428.9ms)
    verdict: unknown.no_rule_matched (low), head_correct=false, inclusion_delay=2

  R-310 declines because Stages.Dominant needs a share of at least
  thresholds.dominance (0.5) and validation reaches 0.497 — short by three tenths
  of a percentage point, about 54ms of stage time. Every other condition R-310
  wants is satisfied: validation is the largest stage and the Engine total is
  well under half of it, so execution is exonerated exactly as intended.

  This is not a tuning problem, and lowering quota_percent will not fix it. A
  cgroup CPU cap starves the consensus client and the signing path on the same
  container, so it inflates validation and signing together and neither can
  dominate. It is the same two-co-dominant-stage gap already recorded for
  p2p-degraded-prysm-r02 under Known issues — a second instance, from a different
  fault, which makes the gap look structural rather than like one odd recording.
  R-999 reporting unknown.no_rule_matched here is correct behaviour: the data was
  complete and the taxonomy has no name for what it shows.

  Do not chase this with severity. Either the taxonomy gains a cause for a
  host-level slowdown that degrades several stages at once, or this recipe needs
  a fault that starves consensus validation without touching the validator
  client, which a per-process cgroup could do and a per-container one cannot.
target: cl-1-lighthouse-geth
timing_target: cl-1-lighthouse-geth
sample_engine_calls: true
validator_candidates: [0, 31]
avoid_proposer_validators: [0, 31]
duration: 25s
fault:
  kind: cgroup_cpu
  cgroup_cpu:
    quota_percent: 5
expect:
  cause: local.cl_slow
  confidence: medium
