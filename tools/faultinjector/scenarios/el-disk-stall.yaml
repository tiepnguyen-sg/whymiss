id: el-disk-stall
description: >
  The Lighthouse-paired execution client's disk write throughput is throttled to
  1MB/s (cgroup v2 io.max) for the full duty window, simulating a saturated
  consumer SSD during Engine API calls.
target: el-1-geth-lighthouse
validator_index: 24
duration: 20s
fault:
  kind: cgroup_io
  cgroup_io:
    write_bytes_per_sec: 1048576
expect:
  cause: local.el_slow
  sub_cause: local.el_slow.disk_saturation
  confidence: medium
