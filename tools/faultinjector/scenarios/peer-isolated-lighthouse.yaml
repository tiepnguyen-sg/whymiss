id: peer-isolated-lighthouse
description: >
  The Prysm node (Lighthouse's only peer on this two-node devnet) is paused for
  the full duty window, isolating Lighthouse's validator from its sole source of
  external attestations and blocks it did not itself produce.
target: vc-1-geth-lighthouse
validator_index: 0
duration: 20s
fault:
  kind: peer_drop
  peer_drop:
    peer_target: cl-2-prysm-geth
avoid_proposer_validators: [32, 63]
expect:
  cause: local.p2p_degraded
  confidence: medium
