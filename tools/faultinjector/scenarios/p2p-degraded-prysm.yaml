id: p2p-degraded-prysm
description: >
  5s of added latency (tc netem) on packets arriving from the Lighthouse peer
  at the Prysm consensus client's network
  path for the full duty window — the same fault as p2p-degraded-lighthouse,
  on the other client. Beacon API, Prometheus, and Engine traffic are excluded
  by the peer-IP filter. require_proposer_validators forces the proposer to
  be the Lighthouse-side validator, so the watched Prysm validator's
  block_seen genuinely depends on cross-node gossip over the throttled
  link (see p2p-degraded-lighthouse's doc comment for the confound this
  avoids and why the delay must exceed the attestation deadline).
target: cl-2-prysm-geth
timing_target: cl-2-prysm-geth
baseline_target: cl-1-lighthouse-geth
validator_candidates: [32, 63]
duration: 25s
require_proposer_validators: [0, 31]
peer_count_target: cl-2-prysm-geth
fault:
  kind: netem
  netem:
    delay: 5s
    peer_target: cl-1-lighthouse-geth
expect:
  cause: local.p2p_degraded
  confidence: medium
