id: vc-slow-cpu
description: >
  The Lighthouse validator client's CPU is capped to 1% of one core (cgroup
  v2 cpu.max, much more aggressive than el-slow-cpu/cl-slow-cpu since BLS
  signing is cheap enough that a looser quota might never queue) for the
  full duty window — unlike vc-frozen-lighthouse's pause, the process keeps
  running and should eventually publish, just late, isolating local.vc_slow
  (published late, head received on time) from local.vc_disconnected
  (never published at all).
target: vc-1-geth-lighthouse
timing_target: cl-1-lighthouse-geth
validator_candidates: [0, 31]
avoid_proposer_validators: [0, 31]
duration: 35s
fault:
  kind: cgroup_cpu
  cgroup_cpu:
    quota_percent: 1
expect:
  cause: local.vc_slow
  confidence: medium
