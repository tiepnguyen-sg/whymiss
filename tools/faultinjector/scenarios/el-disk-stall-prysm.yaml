id: el-disk-stall-prysm
description: >
  The Prysm-paired execution client's disk write throughput is throttled to
  1MB/s (cgroup v2 io.max) for the full duty window — the same fault as
  el-disk-stall, on the other client.
target: el-2-geth-prysm
validator_index: 40
duration: 20s
fault:
  kind: cgroup_io
  cgroup_io:
    write_bytes_per_sec: 1048576
expect:
  cause: local.el_slow
  sub_cause: local.el_slow.disk_saturation
  confidence: medium
