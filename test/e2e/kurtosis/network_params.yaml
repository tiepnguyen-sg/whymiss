# Kurtosis devnet for whymiss's fault-injection corpus (test/corpus) and e2e tests.
#
# BUILD_PROMPT §3 locks initial client support to Lighthouse and Prysm only — this
# file provisions exactly one node of each, which is also the minimum needed to
# prove internal/source/registry.go's client detection actually branches (I-11).
#
# Bring up with `make devnet.up`; do not invoke kurtosis directly (AGENTS.md: use
# Makefile targets, not ad-hoc shell). See docs/BUILD_PROMPT.md task 1.5.
participants:
  - el_type: geth
    cl_type: lighthouse
    vc_type: lighthouse
    # Devnet-only derivative of the digest-pinned Lighthouse image. The
    # validator process starts with libfaketime preloaded so clock_skew can
    # update its perceived wall-clock offset without restarting it.
    vc_image: whymiss/lighthouse-faketime:local
    use_separate_vc: true
    count: 1

  - el_type: geth
    cl_type: prysm
    vc_type: prysm
    use_separate_vc: true
    count: 1

  # A third node exists so that a block can be late for the *network* rather
  # than for one observer. R-110 needs the watched node and an independent
  # baseline node to agree that the block arrived late; with only two nodes the
  # proposer is always one of those two, and a node does not record a gossip
  # arrival for a block it produced itself, so one of the two measurements was
  # always missing and network.late_block was unreproducible by construction.
  # With three, the proposer can be a party to neither measurement.
  #
  # Kept as a second Prysm rather than a third client type: BUILD_PROMPT §3
  # locks client support to Lighthouse and Prysm, and this node exists for its
  # position in the topology, not to exercise an adapter.
  - el_type: geth
    cl_type: prysm
    vc_type: prysm
    use_separate_vc: true
    count: 1

network_params:
  # Must be the literal string "kurtosis" — the ethereum-package's dispatcher
  # (participant_network.star) treats any other value as the name of a
  # pre-existing public devnet and tries to fetch its genesis config from a
  # remote repo instead of generating one locally. Any other value crashes
  # (verified: "whymiss-devnet" fails calculate_devnet_url with an out-of-range
  # index, because it doesn't match that lookup's "{category}-devnet-{number}"
  # naming convention). The enclave name (--enclave flag, set in the Makefile)
  # is whymiss's own identifier and is unaffected by this.
  network: kurtosis
  # Halved from the package default (128/node) to keep two-node finalization
  # light enough for a laptop while comfortably clearing the minimum needed to
  # finalize (Kurtosis's own minimal-devnet examples use similarly small counts).
  num_validator_keys_per_node: 32
  seconds_per_slot: 12
  # A few seconds of slack over the 20s default: genesis coordination between two
  # separately-launched client pairs is the step most likely to need it on a
  # loaded dev machine.
  genesis_delay: 30
  # The package default enables Fulu (PeerDAS) from genesis, which then refuses
  # to start unless a supernode is configured or every node has 128+ validators
  # (verified: it fails fast with that exact message otherwise). PeerDAS has
  # nothing to do with attestation/proposer duty timing, the only thing
  # faultinjector's scenarios exercise, so it stays unscheduled — same sentinel
  # the package itself uses for gloas_fork_epoch by default.
  fulu_fork_epoch: 18446744073709551615
  # BPO (blob parameter override) forks require Fulu; with Fulu unscheduled, every
  # bpo_*_epoch must be explicitly disabled too, or genesis fails validation.
  # bpo_3/4/5 are already unscheduled in the package default — only 1 and 2 need
  # overriding here.
  bpo_1_epoch: 18446744073709551615
  bpo_2_epoch: 18446744073709551615

# No MEV, no block explorer, no extra observability stack (dora/prometheus/
# grafana) — whymiss's own promscrape adapter (Phase 2) is what will read
# client metrics, not this devnet's tooling. Keep the footprint to what
# faultinjector and the corpus generator actually need.
mev_type: null

# A transaction spammer keeps real work flowing through the Engine API. Without
# load, geth's newPayload is a handful of milliseconds (measured:
# beacon_block_delay_execution_time = 3-5) and no cgroup CPU or io.max cap can
# make it miss a deadline — which is why local.el_slow and local.host.disk_io
# were attempted repeatedly across earlier cycles and never produced clean
# evidence. A passive resource cap can only gate work that exists.
#
# spamoor, not tx_fuzz. tx_fuzz was tried first and logs "Spamming 6
# transactions per account on 100 accounts" and then nothing: every EL's txpool
# stayed at pending 0x0, every block came back gasUsed 0 / 0 txs, and
# execution_time stayed at 3ms. The faucet it names holds ~10M ETH and the EL
# layer is peered, so it is not a funding or connectivity problem — the spammer
# simply never lands a transaction. Anyone reading an older cycle's "we added
# load and it made no difference" should check that load actually existed.
additional_services:
  - spamoor

wait_for_finalization: false
